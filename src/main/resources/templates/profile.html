<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mi perfil | UniMatch</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><main class="access-page"><section class="access-card"><a class="back-button" href="/discover">Volver</a><p class="eyebrow">MI PERFIL</p><h1>Edita tus gustos.</h1><form id="profile-form" class="auth-form"><div class="profile-photo-editor"><img id="profile-photo-preview" class="profile-photo-preview hidden" alt="Tu foto de perfil"><span id="profile-photo-placeholder" class="profile-photo-placeholder">?</span><label class="profile-photo-action" for="profile-photo-input">Agregar o cambiar foto</label><input id="profile-photo-input" type="file" accept="image/png, image/jpeg" class="hidden"></div><label>Nombre<input id="profile-name" required></label><label>Carrera<input id="profile-degree" required></label><label>Bio<textarea id="profile-bio" maxlength="280"></textarea></label><fieldset class="interest-picker"><legend>Mis gustos</legend><div id="profile-interests" class="interest-list"></div></fieldset><div class="custom-interest"><strong>Agrega un gusto propio</strong><input id="custom-interest-name" placeholder="Ejemplo: The Weeknd"><select id="custom-interest-type"><option value="ARTIST">Artista</option><option value="MOVIE">Pelicula</option><option value="SERIES">Serie</option><option value="MUSIC_GENRE">Genero musical</option><option value="MOVIE_GENRE">Genero de cine</option></select><button id="add-interest" type="button">Agregar</button></div><button class="button" type="submit">Guardar cambios</button></form><p id="profile-message" class="auth-message"></p></section></main><script src="/js/profile.js"></script></body></html>
