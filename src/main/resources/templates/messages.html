<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes | UniMatch</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main class="messages-page">
    <header class="discover-header"><a class="brand" href="/discover">UniMatch</a><a class="text-button" href="/discover">Descubrir</a></header>
    <section class="messages-layout">
        <aside class="conversation-list"><p class="eyebrow">MENSAJES</p><h1>Matches</h1><div id="match-contacts"></div></aside>
        <section class="conversation-view"><div id="conversation-title" class="conversation-title">Elige un match</div><div id="conversation-messages" class="conversation-messages"></div><form id="message-form" class="chat-form hidden"><input id="message-input" maxlength="500" placeholder="Escribe un mensaje" required><button type="submit">Enviar</button></form></section>
    </section>
</main>
<script src="/js/messages.js"></script>
</body>
</html>
